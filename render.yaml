services:
  - type: web
    name: ai-image-studio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: https://hs047502-collab.github.io
      - key: OPENROUTER_API_KEY
        sync: false
